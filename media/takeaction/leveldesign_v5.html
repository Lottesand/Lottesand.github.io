function bounds(b){
  const xs=b.cells.map(c=>c[0]),ys=b.cells.map(c=>c[1]),zs=b.cells.map(c=>c[2]);
  return {x0:Math.min(...xs)*CELL-HALF,x1:Math.max(...xs)*CELL+HALF,y0:Math.min(...ys)*CELL-HALF,y1:Math.max(...ys)*CELL+HALF,
          z0:Math.min(...zs)*CELL-HALF,z1:Math.max(...zs)*CELL+HALF};
}
function visible(it){
  if(it.ghost && !$('ghost').checked) return false;
  if(it.cat==='floor' && !$('floor').checked) return false;
  const B=bounds(cur), cut=B.z0+(B.z1-B.z0)*$('cut').value/100;
  return it.c[2]-it.s[2]/2 <= cut;
}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;r=Math.min(255,r*f|0);g=Math.min(255,g*f|0);b=Math.min(255,b*f|0);return `rgb(${r},${g},${b})`}


// ---------- 3D view ----------
const FACES=[[0,1,2,3],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]];
function draw3d(){
  const cv=document.querySelector('#blk canvas.v3'); if(!cv) return; const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr; cv.height=r.height*dpr; const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width,H=r.height; g.clearRect(0,0,W,H);
  const B=bounds(cur), mx=(B.x0+B.x1)/2,my=(B.y0+B.y1)/2,mz=(B.z0+B.z1)/2, ext=Math.max(B.x1-B.x0,B.y1-B.y0,B.z1-B.z0);
  const s=Math.min(W,H)/ext*0.78*cam.zoom, ca=Math.cos(cam.az),sa=Math.sin(cam.az),ce=Math.cos(cam.el),se=Math.sin(cam.el);
  const T=p=>{const x=p[0]-mx,y=p[1]-my,z=p[2]-mz;const X=x*ca-y*sa,Y=x*sa+y*ca;return [W/2+X*s, H/2-(z*ce-Y*se)*s, Y*ce+z*se]};
  const L=[0.4,-0.6,0.7], polys=[], lines=[];
  // cell wireframes
  for(const c of cur.cells){const it={c:[c[0]*CELL,c[1]*CELL,c[2]*CELL],s:[CELL,CELL,CELL],yaw:0};const P=corners(it).map(T);
    for(const [a,b] of [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]])lines.push([P[a],P[b],'rgba(56,189,248,.35)',[6,4]])}
  for(const it of cur.items){ if(!visible(it)) continue;
    const C=corners(it), P=C.map(T);
    if(it.ghost){for(const [a,b] of [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]])lines.push([P[a],P[b],'rgba(56,189,248,.8)',[3,2]]);continue}
    for(const f of FACES){
      const a=C[f[0]],b=C[f[1]],c=C[f[2]];
      const u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];
      let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];const ln=Math.hypot(...n)||1;n=n.map(q=>q/ln);
      const cx=(C[f[0]][0]+C[f[2]][0])/2-(it.c[0]),cy=(C[f[0]][1]+C[f[2]][1])/2-(it.c[1]),cz=(C[f[0]][2]+C[f[2]][2])/2-(it.c[2]);
      if(n[0]*cx+n[1]*cy+n[2]*cz<0)n=n.map(q=>-q);
      const lum=0.55+0.45*Math.max(0,n[0]*L[0]+n[1]*L[1]+n[2]*L[2]);
      const pts=f.map(i=>P[i]); const d=pts.reduce((q,p)=>q+p[2],0)/4;
      polys.push([d,pts,shade(it.col,lum),it]);
    }
  }
  polys.sort((p,q)=>q[0]-p[0]);
  for(const [d,pts,col,it] of polys){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(const p of pts.slice(1))g.lineTo(p[0],p[1]);g.closePath();
    g.globalAlpha=it.cat==='floor'?0.55:1;g.fillStyle=col;g.fill();g.globalAlpha=1;g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=.6;g.stroke()}
  for(const [a,b,col,dash] of lines){g.setLineDash(dash);g.strokeStyle=col;g.lineWidth=1;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}
  g.setLineDash([]);
  for(const it of cur.items){ if(!it.n||!visible(it)) continue; const p=T([it.c[0],it.c[1],it.c[2]+it.s[2]/2+20]);
    g.fillStyle=it.col;g.beginPath();g.arc(p[0],p[1],8,0,7);g.fill();g.strokeStyle='#000';g.stroke();g.fillStyle='#fff';g.font='bold 10px sans-serif';g.textAlign='center';g.fillText(it.n,p[0],p[1]+3.5)}
  // Charlie for scale at the first cell centre
  const c0=cur.cells[0]; const ch={c:[c0[0]*CELL+300,c0[1]*CELL+300,c0[2]*CELL+90],s:[80,80,180],yaw:0};
}
function bind3d(){const cv=document.querySelector('#blk canvas.v3'); if(!cv) return; let drag=null;
  cv.addEventListener('pointerdown',e=>{drag=[e.clientX,e.clientY,cam.az,cam.el];cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{if(!drag)return;cam.az=drag[2]+(e.clientX-drag[0])*0.008;cam.el=Math.max(-1.5,Math.min(1.5,drag[3]+(e.clientY-drag[1])*0.008));draw3d()});
  cv.addEventListener('pointerup',()=>drag=null);
  cv.addEventListener('wheel',e=>{e.preventDefault();cam.zoom=Math.max(0.3,Math.min(6,cam.zoom*(e.deltaY<0?1.12:0.89)));draw3d()},{passive:false});
  cv.addEventListener('dblclick',()=>{cam={az:-0.75,el:0.55,zoom:1};draw3d()});
}


function pick(id){
  try{localStorage.setItem('bld4',id)}catch(e){}
  document.querySelectorAll('aside button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  if(PAGES[id]){cur=null;$('blk').innerHTML=PAGES[id];window.scrollTo(0,0);return}
  cur=BLOCKS.find(b=>b.id===id); $('blk').innerHTML=cur.html; bind3d(); draw3d(); window.scrollTo(0,0);
}
let html=''; for(const sc of [1,2,3]){html+=`<div class="sc">SCENE ${sc}</div>`+BLOCKS.filter(b=>b.scene===sc).map(b=>`<button data-id="${b.id}">${esc(b.name)}</button>`).join('')}
$('list').innerHTML=html; document.querySelector('aside').addEventListener('click',e=>{const b=e.target.closest('button');if(b)pick(b.dataset.id)});
for(const id of ['ghost','floor','cut']) $(id).addEventListener('input',()=>{if(cur)draw3d()});
window.addEventListener('resize',()=>{if(cur)draw3d()});
let first='__rules'; try{first=localStorage.getItem('bld4')||first}catch(e){}
pick((PAGES[first]||BLOCKS.some(b=>b.id===first))?first:'__rules');
</script></body></html>
