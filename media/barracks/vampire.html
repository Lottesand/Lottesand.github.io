                else if (roll < 0.012) this.state.drops.push({ x: enemy.x, y: enemy.y, r: 8, type: 'heart' });
                else if (roll < 0.024) this.state.drops.push({ x: enemy.x, y: enemy.y, r: 8, type: 'magnet' });
                else if (Math.random() < 0.12) this.state.drops.push({ x: enemy.x, y: enemy.y, r: 6, type: 'gold', v: 10 });

                this.state.effects.push({ type: 'death', x: enemy.x, y: enemy.y, life: 0.3, r: enemy.r });
                if (index > -1) this.state.enemies.splice(index, 1);
                this.bleep('hit');
            },

            gainXp(v) {
                this.state.xp += v;
                if (this.state.xp >= this.state.nextXp) {
                    this.state.xp -= this.state.nextXp;
                    this.levelUp();
                }
            },

            nextXpReq(lv) {
                return Math.round(20 + lv * 10 + Math.pow(lv, 1.5) * 5);
            },

            levelUp() {
                this.state.level++;
                this.state.nextXp = this.nextXpReq(this.state.level);
                
                // Bomb screen clear react whenever player levels up!
                this.triggerBombReact();

                // Check if any upgrades remain
                const availableUpgrades = this.getAvailableUpgrades();
                if (availableUpgrades.length === 0) {
                    // Nothing left to upgrade: just bomb react and keep going!
                    return;
                }

                this.state.keys.clear();
                this.state.running = false;
                this.showLevelCards(availableUpgrades);
            },

            getAvailableUpgrades() {
                const p = this.state.player;
                const upgradePool = [];

                const evolvedBaseWeapons = new Set();
                for (const evoKey in this.DATA.EVOLUTIONS) {
                    if (p.weapons[evoKey]) {
                        evolvedBaseWeapons.add(this.DATA.EVOLUTIONS[evoKey].weapon);
                    }
                }

                // Evolution ready check
                for (const key in this.DATA.EVOLUTIONS) {
                    const evo = this.DATA.EVOLUTIONS[key];
                    if (!p.weapons[key] &&
                        p.weapons[evo.weapon]?.level >= this.DATA.WEAPONS[evo.weapon].maxLevel &&
                        p.passives[evo.passive]?.level >= this.DATA.PASSIVES[evo.passive].maxLevel) {
                        upgradePool.push({
                            name: `진화: ${evo.name}`,
                            detail: evo.detail,
                            isEvolved: true,
                            apply: () => {
                                delete p.weapons[evo.weapon];
                                p.weapons[key] = { level: 1, cd: 0 };
                            }
                        });
                    }
                }

                // Normal Weapons
                for (const key in this.DATA.WEAPONS) {
                    if (evolvedBaseWeapons.has(key)) continue;
                    const weapon = p.weapons[key];
                    const wData = this.DATA.WEAPONS[key];
                    if (!weapon && Object.keys(p.weapons).filter(k => !k.startsWith('evo_')).length < 4) {
                        upgradePool.push({
                            name: `${wData.name} 획득`,
                            detail: wData.levels[0].detail,
                            apply: () => { p.weapons[key] = { level: 1, cd: 0 }; }
                        });
                    } else if (weapon && weapon.level < wData.maxLevel) {
                        upgradePool.push({
                            name: `${wData.name} Lv.${weapon.level + 1}`,
                            detail: wData.levels[weapon.level].detail,
                            apply: () => { weapon.level++; weapon.cd = 0; }
                        });
                    }
                }

                // Passives
                for (const key in this.DATA.PASSIVES) {
                    const passive = p.passives[key];
                    const pData = this.DATA.PASSIVES[key];
                    if (!passive && Object.keys(p.passives).length < 4) {
                        upgradePool.push({
                            name: `${pData.name} 획득`,
                            detail: pData.levels[0].detail,
                            apply: () => { p.passives[key] = { level: 1 }; this.applyPassive(key, 0); }
                        });
                    } else if (passive && passive.level < pData.maxLevel) {
                        upgradePool.push({
                            name: `${pData.name} Lv.${passive.level + 1}`,
                            detail: pData.levels[passive.level].detail,
                            apply: () => { passive.level++; this.applyPassive(key, passive.level - 1); }
                        });
                    }
                }

                return upgradePool;
            },

            showLevelCards(pool) {
                const upgradePool = pool || this.getAvailableUpgrades();
                if (upgradePool.length === 0) {
                    this.resume();
                    return;
                }

                this.dom.lvlOpts.innerHTML = '';
                this.dom.lvlup.style.display = 'grid';

                const finalOptions = [];
                const evolutionOptions = upgradePool.filter(o => o.isEvolved);
                const normalOptions = upgradePool.filter(o => !o.isEvolved);
                if (evolutionOptions.length > 0) finalOptions.push(evolutionOptions[0]);

                while (finalOptions.length < 3 && normalOptions.length > 0) {
                    const idx = Math.floor(Math.random() * normalOptions.length);
                    finalOptions.push(normalOptions.splice(idx, 1)[0]);
                }

                for (const opt of finalOptions) {
                    const div = document.createElement('div');
                    div.className = 'opt';
                    if (opt.isEvolved) div.classList.add('evolved');
                    div.innerHTML = `<div>${opt.name}<div class="muted" style="font-size:12px">${opt.detail}</div></div><button>선택</button>`;
                    div.onclick = () => {
                        opt.apply();
                        this.dom.lvlup.style.display = 'none';
                        this.resume();
                    };
                    this.dom.lvlOpts.appendChild(div);
                }
            },

            applyPassive(key, level) {
                const pData = this.DATA.PASSIVES[key].levels[level];
                if (key === 'maxHp') {
                    this.state.player.maxHp += pData.value;
                    this.state.player.hp += pData.value;
                }
            },

            updateUI() {
                const p = this.state.player;
                const cleanHp = Math.max(0, p.hp);
                const hpPct = cleanHp / p.maxHp;
                this.dom.hpFill.style.inset = `0 ${(1 - hpPct) * 100}% 0 0`;
                this.dom.hpText.textContent = `${Math.ceil(cleanHp)}/${p.maxHp}`;
                const xpPct = this.state.xp / this.state.nextXp;
                this.dom.xpFill.style.inset = `0 ${(1 - xpPct) * 100}% 0 0`;
                this.dom.lvText.textContent = this.state.level;
                this.dom.goldText.textContent = this.state.goldEarned;
                this.dom.killsText.textContent = this.state.totalKills;
                this.drawMinimap();
                this.drawFullMap();
            },

            gameOver() {
                this.state.running = false;
                const finalScore = (this.state.totalKills * 10) + (this.state.stageLevel * 500);
                this.dom.startMenu.innerHTML = `<h2>게임 오버</h2><p>최종 점수: ${finalScore} | 획득 골드: ${this.state.goldEarned}</p><div class="btns"><button id="exitBtn">메인 메뉴로</button></div>`;
                document.getElementById('exitBtn').onclick = () => this.endGame();
                this.dom.startMenu.style.display = 'block';
            },

            endGame() {
                if (this.onGameEnd) {
                    const finalScore = (this.state.totalKills * 10) + (this.state.stageLevel * 500);
                    this.onGameEnd(this.state.goldEarned, finalScore);
                }
            },

            pause() {
                this.state.keys.clear();
                this.state.running = false;
                this.dom.startMenu.innerHTML = `<h2>일시정지</h2><p>플레이어 생존 시간: ${this.formatTime(this.state.time)}</p><div class="btns"><button id="resumeBtn">계속하기</button><button id="exitBtnPause" style="background:none;">나가기</button></div>`;
                document.getElementById('resumeBtn').onclick = () => this.resume();
                document.getElementById('exitBtnPause').onclick = () => this.endGame();
                this.dom.startMenu.style.display = 'block';
            },

            resume() {
                this.dom.startMenu.style.display = 'none';
                this.state.lastT = performance.now();
                this.state.running = true;
            },

            onKey(e, down) {
                if (!e || !this.state || !this.state.keys) return;
                const key = e.key ? e.key.toLowerCase() : "";
                if (!this.state.running && this.dom.lvlup.style.display === 'none' && !this.statsVisible) {
                    if (!['p', 'escape', 'i', 'ㅑ', 'tab'].includes(key)) return;
                }

                if (down) this.state.keys.add(key);
                else this.state.keys.delete(key);

                if (key === 'tab') {
                    e.preventDefault();
                    this.dom.fullMapOverlay.classList.toggle('active', down);
                }

                if (down && (key === 'i' || key === 'ㅑ')) {
                    this.toggleStatsPanel();
                } else if (down && key === 'p') {
                    this.state.running ? this.pause() : this.resume();
                } else if (down && key === 'escape') {
                    if (this.state.running) this.pause();
                }
            },

            toggleStatsPanel() {
                this.statsVisible = !this.statsVisible;
                if (this.statsVisible) {
                    this.wasRunningBeforeStats = this.state.running;
                    if (this.wasRunningBeforeStats) {
                        this.state.running = false;
                    }
                    this.updateStatsUI();
                    this.dom.statsPanel.style.display = 'block';
                } else {
                    this.dom.statsPanel.style.display = 'none';
                    if (this.wasRunningBeforeStats && this.dom.startMenu.style.display === 'none' && this.dom.lvlup.style.display === 'none') {
                        this.resume();
                    }
                }
            },

            updateStatsUI() {
                const p = this.state.player;
                let html = `<h4>플레이어 상세 스탯 (스크롤 가능)</h4>`;
                const upgrades = this.currentUser?.upgrades || { maxHp: 0, attack: 0, speed: 0, pickup: 0 };
                const shopAttackBonus = 1 + ((upgrades.attack || 0) * app.SHOP_DATA.stats.attack.bonusPerLevel);
                const passiveAttackBonus = 1 + (p.passives.attack?.level || 0) * 0.1;
                const totalAttackBonus = shopAttackBonus * passiveAttackBonus;

                html += `<div class="stat-row"><span>최대 HP</span> <span class="value">${p.maxHp}</span></div>`;
                html += `<div class="stat-row"><span>이동 속도</span> <span class="value">${Math.round(p.speed * (1 + (p.passives.speed?.level || 0) * 0.1))}</span></div>`;
                html += `<div class="stat-row"><span>자력 범위</span> <span class="value">${Math.round(p.pickup + (p.passives.pickup?.level || 0) * 40)}px</span></div>`;

                for (const key in p.weapons) {
                    html += `<hr style="border:0; border-top:1px solid #223142; margin:10px 0;">`;
                    const weapon = p.weapons[key];
                    if (key.startsWith('evo_')) {
                        const wData = this.DATA.EVOLUTIONS[key];
                        html += `<div class="stat-row" style="opacity:1"><strong>${wData.name}</strong></div>`;
                    } else {
                        const wData = this.DATA.WEAPONS[key];
                        const spec = wData.levels[weapon.level - 1];
                        html += `<div class="stat-row" style="opacity:1"><strong>${wData.name} (Lv.${weapon.level})</strong></div>`;
                        if (spec.dmg) html += `<div class="stat-row"><span>데미지</span> <span class="value">${Math.round(spec.dmg * totalAttackBonus)}</span></div>`;
                        if (spec.fireRate) html += `<div class="stat-row"><span>쿨타임</span> <span class="value">${(spec.fireRate * (1 - (p.passives.cooldown?.level || 0) * 0.08)).toFixed(2)}s</span></div>`;
                        if (spec.count) html += `<div class="stat-row"><span>개수</span> <span class="value">${spec.count}</span></div>`;
                        if (spec.pierce) html += `<div class="stat-row"><span>관통</span> <span class="value">${spec.pierce}</span></div>`;
                    }
                }
                for (const key in p.passives) {
                    const passive = p.passives[key];
                    const pData = this.DATA.PASSIVES[key];
                    html += `<hr style="border:0; border-top:1px solid #223142; margin:10px 0;">`;
                    html += `<div class="stat-row" style="opacity:1"><strong>${pData.name} (Lv.${passive.level})</strong></div>`;
                }
                this.dom.statsPanel.innerHTML = html;
            },

            toggleDevMode() {
                this.state.devMode = !this.state.devMode;
                this.dom.devPanel.classList.toggle('active', this.state.devMode);
            },

            toggleGodMode() {
                this.state.player.isInvincible = !this.state.player.isInvincible;
                this.dom.devGodModeBtn.textContent = `God Mode: ${this.state.player.isInvincible ? 'ON' : 'OFF'}`;
            },

            devMasterWeapons() {
                const p = this.state.player;
                for (const key in this.DATA.WEAPONS) {
                    p.weapons[key] = { level: this.DATA.WEAPONS[key].maxLevel, cd: 0 };
                }
                for (const key in this.DATA.PASSIVES) {
                    p.passives[key] = { level: this.DATA.PASSIVES[key].maxLevel };
                    this.applyPassive(key, 0); this.applyPassive(key, 1); this.applyPassive(key, 2);
                }
                this.showLevelCards();
            },

            draw() {
                if (!this.state || !this.state.player) return;
                this.ctx.fillStyle = this.state.mapColor;
                this.ctx.fillRect(0, 0, this.dom.canvas.clientWidth, this.dom.canvas.clientHeight);

                // Draw solid round rocks
                for (const obs of this.state.obstacles) {
                    this.ctx.fillStyle = '#4a4a4a';
                    this.ctx.beginPath();
                    this.ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.strokeStyle = '#242424';
                    this.ctx.lineWidth = 3;
                    this.ctx.stroke();
                }

                // Draw Room Doors
                const room = this.state.mapGrid[`${this.state.currentRoomCoords.x},${this.state.currentRoomCoords.y}`];
                if (room && room.cleared) {
                    const doorSize = 44;
                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    if (room.doors.N) this.ctx.fillRect(this.state.bounds.w / 2 - doorSize / 2, 0, doorSize, 14);
                    if (room.doors.S) this.ctx.fillRect(this.state.bounds.w / 2 - doorSize / 2, this.state.bounds.h - 14, doorSize, 14);
                    if (room.doors.W) this.ctx.fillRect(0, this.state.bounds.h / 2 - doorSize / 2, 14, doorSize);
                    if (room.doors.E) this.ctx.fillRect(this.state.bounds.w - 14, this.state.bounds.h / 2 - doorSize / 2, 14, doorSize);
                }

                for (const d of this.state.drops) { this.drawDrop(d); }

                // Draw enemies with distinct high-contrast health bars
                for (const e of this.state.enemies) {
                    this.ctx.save();
                    if (e.hitTimer > 0) this.ctx.filter = 'brightness(2.2)';
                    this.ctx.fillStyle = '#e05663';
                    this.ctx.beginPath();
                    this.ctx.arc(e.x, e.y, 12, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();

                    // Distinct enemy HP bar
                    const hpPct = Math.max(0, e.displayHp / e.maxHp);
                    const barWidth = 26;
                    const barHeight = 5;
                    const barX = e.x - barWidth / 2;
                    const barY = e.y - e.r - 10;
                    this.ctx.fillStyle = '#5a1e23'; // Dark red background
                    this.ctx.fillRect(barX, barY, barWidth, barHeight);
                    this.ctx.fillStyle = 'var(--danger)'; // Bright red foreground
                    this.ctx.fillRect(barX, barY, barWidth * hpPct, barHeight);
                    this.ctx.strokeStyle = '#05070a';
                    this.ctx.lineWidth = 1.5;
                    this.ctx.strokeRect(barX, barY, barWidth, barHeight);
                }

                this.drawWeapons();

                // Draw Player
                this.ctx.save();
                if (this.state.player.hitTimer > 0 && Math.floor(this.state.player.hitTimer * 20) % 2 === 0) {
                    this.ctx.globalAlpha = 0.5;
                }
                const p = this.state.player;
                this.ctx.fillStyle = '#8be9a6';
                this.ctx.beginPath();
                this.ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
                this.ctx.fill();
                this.ctx.restore();

                for (const effect of this.state.effects) { this.drawEffect(effect); }

                for (const dn of this.state.damageNumbers) {
                    this.ctx.save();
                    this.ctx.font = 'bold 12px sans-serif';
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${dn.life / 0.6})`;
                    this.ctx.strokeStyle = `rgba(0, 0, 0, ${dn.life / 0.6})`;
                    this.ctx.lineWidth = 2;
                    this.ctx.strokeText(dn.text, dn.x, dn.y);
                    this.ctx.fillText(dn.text, dn.x, dn.y);
                    this.ctx.restore();
                }
            },

            drawDrop(d) {
                this.ctx.save();
                this.ctx.translate(d.x, d.y);
                this.ctx.scale(d.r / 8, d.r / 8);
                const glow = Math.abs(Math.sin(this.state.time * 3)) * 0.5 + 0.5;

                if (d.type === 'xp') {
                    this.ctx.fillStyle = 'rgba(110,220,255,.9)';
                    this.ctx.beginPath(); this.ctx.arc(0, 0, 6, 0, Math.PI * 2); this.ctx.fill();
                } else if (d.type === 'gold') {
                    this.ctx.fillStyle = '#ffd700';
                    this.ctx.beginPath(); this.ctx.arc(0, 0, 6, 0, Math.PI * 2); this.ctx.fill();
                } else if (d.type === 'heart') {
                    this.ctx.fillStyle = `rgb(255, ${100 + glow * 100}, ${100 + glow * 100})`;
                    this.ctx.beginPath(); this.ctx.moveTo(0, -3);
                    this.ctx.bezierCurveTo(-8, -12, -12, 0, 0, 5);
                    this.ctx.bezierCurveTo(12, 0, 8, -12, 0, -3); this.ctx.fill();
                } else if (d.type === 'magnet') {
                    this.ctx.fillStyle = `rgb(${150 + glow * 100}, ${150 + glow * 100}, 255)`;
                    this.ctx.fillRect(-6, -6, 4, 10); this.ctx.fillRect(2, -6, 4, 10); this.ctx.fillRect(-6, -6, 12, 4);
                } else if (d.type === 'bomb') {
                    this.ctx.fillStyle = 'black'; this.ctx.beginPath(); this.ctx.arc(0, 0, 8, 0, Math.PI * 2); this.ctx.fill();
                    this.ctx.fillStyle = `rgb(255, ${200 - glow * 100}, 50)`; this.ctx.beginPath(); this.ctx.arc(0, 0, 3, 0, Math.PI * 2); this.ctx.fill();
                }
                this.ctx.restore();
            },

            drawEffect(effect) {
                const lifePct = effect.life / 0.3;
                if (effect.type === 'death') {
                    this.ctx.fillStyle = `rgba(255, 255, 255, ${lifePct})`;
                    for (let i = 0; i < 5; i++) {
                        const r = effect.r * (1 - lifePct) * 2;
                        const angle = (i * Math.PI * 2) / 5 + this.state.time * 10;
                        const x = effect.x + Math.cos(angle) * r;
                        const y = effect.y + Math.sin(angle) * r;
                        this.ctx.beginPath(); this.ctx.arc(x, y, 2, 0, Math.PI * 2); this.ctx.fill();
                    }
                } else if (effect.type === 'explosion') {
                    this.ctx.fillStyle = `rgba(255, 200, 80, ${lifePct * 0.8})`;
                    this.ctx.beginPath(); this.ctx.arc(effect.x, effect.y, (effect.r || 60) * (1 - lifePct * 0.4), 0, Math.PI * 2); this.ctx.fill();
                } else if (effect.type === 'lightning') {
                    this.ctx.strokeStyle = `rgba(113, 210, 255, ${effect.life * 2})`;
                    this.ctx.lineWidth = 3; this.ctx.beginPath();
                    for (let i = 0; i < 5; i++) { this.ctx.lineTo(effect.x + this.rand(-20, 20), effect.y + this.rand(-20, 20)); }
                    this.ctx.stroke();
                }
            },

            drawWeapons() {
                if (!this.state.projs) return;
                for (const b of this.state.projs) {
                    this.ctx.save();
                    this.ctx.translate(b.x, b.y);
                    if (b.type === 'base') {
                        this.ctx.fillStyle = '#eaf0f6';
                        this.ctx.beginPath(); this.ctx.arc(0, 0, 4, 0, Math.PI * 2); this.ctx.fill();
                    } else if (b.type === 'lance') {
                        const angle = Math.atan2(b.vy, b.vx);
                        this.ctx.rotate(angle);
                        this.ctx.fillStyle = '#ffc974'; this.ctx.fillRect(-12, -3, 24, 6);
                    } else if (b.type === 'blade') {
                        this.ctx.rotate(this.state.time * 15);
                        this.ctx.strokeStyle = '#74d2ff'; this.ctx.lineWidth = 3;
                        this.ctx.beginPath(); this.ctx.arc(0, 0, 10, 0, Math.PI * 1.5); this.ctx.stroke();
                    } else if (b.type === 'missile') {
                        const angle = Math.atan2(b.vy, b.vx);
                        this.ctx.rotate(angle + Math.PI / 2);
                        this.ctx.fillStyle = b.isEvolved ? '#ff4d4d' : `hsl(${Math.floor(this.state.time * 200) % 360}, 90%, 70%)`;
                        this.ctx.beginPath(); this.ctx.moveTo(0, -10); this.ctx.lineTo(6, 6); this.ctx.lineTo(-6, 6); this.ctx.closePath(); this.ctx.fill();
                    } else if (b.type === 'evo_base') {
                        this.ctx.fillStyle = '#ff6b6b';
                        this.ctx.beginPath(); this.ctx.arc(0, 0, b.r, 0, Math.PI * 2); this.ctx.fill();
                    } else if (b.type === 'evo_lance') {
                        const angle = Math.atan2(b.vy, b.vx);
                        this.ctx.rotate(angle);
                        this.ctx.fillStyle = '#71d2ff'; this.ctx.fillRect(-20, -5, 40, 10);
                    } else if (b.type === 'evo_blade') {
                        this.ctx.rotate(b.angle + this.state.time * 20);
                        this.ctx.strokeStyle = '#9bff8a'; this.ctx.lineWidth = 4;
                        this.ctx.beginPath();
                        this.ctx.moveTo(-14, 0); this.ctx.lineTo(14, 0);
                        this.ctx.moveTo(0, -14); this.ctx.lineTo(0, 14);
                        this.ctx.stroke();
                    }
                    this.ctx.restore();
                }

                // Draw orbiters directly without trail
                const p = this.state.player;
                const orbKey = p.weapons.orbiter ? 'orbiter' : (p.weapons.evo_orbiter ? 'evo_orbiter' : null);
                if (orbKey) {
                    const isEvo = orbKey === 'evo_orbiter';
                    const spec = isEvo ? { count: 6, rotSpeed: 7.5, range: 145 } : this.DATA.WEAPONS.orbiter.levels[p.weapons.orbiter.level - 1];
                    const size = isEvo ? 24 : 15;
                    const color = isEvo ? '#ff4d6d' : '#ff9a74';
                    const angleStep = (Math.PI * 2) / spec.count;
                    for (let i = 0; i < spec.count; i++) {
                        const angle = this.state.time * spec.rotSpeed + angleStep * i;
                        const ox = p.x + Math.cos(angle) * spec.range;
                        const oy = p.y + Math.sin(angle) * spec.range;
                        this.ctx.fillStyle = color;
                        this.ctx.beginPath();
                        this.ctx.arc(ox, oy, size / 2, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                }
            },

            drawMinimap() {
                const ctx = this.minimapCtx;
                const { width, height } = this.dom.minimapCanvas;
                ctx.clearRect(0, 0, width, height);

                const roomSize = 10;
                const padding = 2;
                const coords = Object.keys(this.state.mapGrid).map(k => k.split(',').map(Number));
                if (coords.length === 0) return;
                const minX = Math.min(...coords.map(c => c[0]));
                const maxX = Math.max(...coords.map(c => c[0]));
                const minY = Math.min(...coords.map(c => c[1]));
                const maxY = Math.max(...coords.map(c => c[1]));

                const mapWidth = (maxX - minX + 1) * (roomSize + padding);
                const mapHeight = (maxY - minY + 1) * (roomSize + padding);
                const offsetX = (width - mapWidth) / 2;
                const offsetY = (height - mapHeight) / 2;

                for (const key in this.state.mapGrid) {
                    const room = this.state.mapGrid[key];
                    if (!room.discovered) continue;
                    const [x, y] = key.split(',').map(Number);
                    const drawX = offsetX + (x - minX) * (roomSize + padding);
                    const drawY = offsetY + (y - minY) * (roomSize + padding);

                    if (x === this.state.currentRoomCoords.x && y === this.state.currentRoomCoords.y) {
                        ctx.fillStyle = 'var(--good)';
                    } else {
                        switch (room.type) {
                            case 'shop': ctx.fillStyle = '#ffd700'; break;
                            case 'boss': ctx.fillStyle = 'var(--danger)'; break;
                            case 'survival': ctx.fillStyle = '#ff9a74'; break;
                            default: ctx.fillStyle = '#556677';
                        }
                    }
                    ctx.fillRect(drawX, drawY, roomSize, roomSize);
                }
            },

            drawFullMap() {
                const ctx = this.fullMapCtx;
                const { width, height } = this.dom.fullMapCanvas;
                ctx.clearRect(0, 0, width, height);

                const roomSize = 22;
                const padding = 6;
                const coords = Object.keys(this.state.mapGrid).map(k => k.split(',').map(Number));
                if (coords.length === 0) return;
                const minX = Math.min(...coords.map(c => c[0]));
                const maxX = Math.max(...coords.map(c => c[0]));
                const minY = Math.min(...coords.map(c => c[1]));
                const maxY = Math.max(...coords.map(c => c[1]));

                const mapWidth = (maxX - minX + 1) * (roomSize + padding);
                const mapHeight = (maxY - minY + 1) * (roomSize + padding);
                const offsetX = (width - mapWidth) / 2;
                const offsetY = (height - mapHeight) / 2;

                ctx.strokeStyle = 'rgba(255,255,255,0.2)';
                ctx.lineWidth = 2;

                for (const key in this.state.mapGrid) {
                    const room = this.state.mapGrid[key];
                    if (!room.discovered) continue;
                    const [x, y] = key.split(',').map(Number);
                    const drawX = offsetX + (x - minX) * (roomSize + padding);
                    const drawY = offsetY + (y - minY) * (roomSize + padding);

                    if (room.doors.N) { ctx.beginPath(); ctx.moveTo(drawX + roomSize / 2, drawY); ctx.lineTo(drawX + roomSize / 2, drawY - padding); ctx.stroke(); }
                    if (room.doors.S) { ctx.beginPath(); ctx.moveTo(drawX + roomSize / 2, drawY + roomSize); ctx.lineTo(drawX + roomSize / 2, drawY + roomSize + padding); ctx.stroke(); }
                    if (room.doors.W) { ctx.beginPath(); ctx.moveTo(drawX, drawY + roomSize / 2); ctx.lineTo(drawX - padding, drawY + roomSize / 2); ctx.stroke(); }
                    if (room.doors.E) { ctx.beginPath(); ctx.moveTo(drawX + roomSize, drawY + roomSize / 2); ctx.lineTo(drawX + roomSize + padding, drawY + roomSize / 2); ctx.stroke(); }
                }

                for (const key in this.state.mapGrid) {
                    const room = this.state.mapGrid[key];
                    if (!room.discovered) continue;
                    const [x, y] = key.split(',').map(Number);
                    const drawX = offsetX + (x - minX) * (roomSize + padding);
                    const drawY = offsetY + (y - minY) * (roomSize + padding);

                    if (x === this.state.currentRoomCoords.x && y === this.state.currentRoomCoords.y) {
                        ctx.fillStyle = 'var(--good)';
                    } else {
                        switch (room.type) {
                            case 'shop': ctx.fillStyle = '#ffd700'; break;
                            case 'boss': ctx.fillStyle = 'var(--danger)'; break;
                            case 'survival': ctx.fillStyle = '#ff9a74'; break;
                            default: ctx.fillStyle = '#556677';
                        }
                    }
                    ctx.fillRect(drawX, drawY, roomSize, roomSize);
                    ctx.strokeStyle = '#111';
                    ctx.strokeRect(drawX, drawY, roomSize, roomSize);
                }
            },

            clamp(v, min, max) { return Math.max(min, Math.min(max, v)); },
            rand(a, b) { return Math.random() * (b - a) + a; },
            dist2(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; },
            formatTime(sec) {
                const s = Math.floor(sec % 60).toString().padStart(2, '0');
                const m = Math.floor(sec / 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            }
        };

        app.init();
        game.init();
    });
    </script>

<!-- ===== 포트폴리오 공개용 추가분 · 원본 게임 코드는 그대로 두고 아래만 덧붙였습니다 ===== -->
<style>
  .pf-guest{width:100%;margin-top:12px;background:linear-gradient(45deg,var(--accent),#4aa2ff);color:#0b0f14;border:none}
  .pf-note{margin:14px 0 0;font-size:12px;opacity:.6;line-height:1.6}
  .wrap{max-width:min(1100px,calc((100vh - 64px) * 16 / 9 + 40px))}
  .pf-joy{position:fixed;left:18px;bottom:18px;width:124px;height:124px;border-radius:50%;background:rgba(113,210,255,.10);border:1px solid rgba(113,210,255,.35);z-index:60;display:none;touch-action:none}
  .pf-joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(113,210,255,.45);pointer-events:none}
  .pf-pause{position:fixed;right:14px;bottom:22px;z-index:60;display:none;font-size:14px;padding:10px 14px}
  @media (max-width:700px){#main-menu-screen .top-bar,#main-menu-screen .bottom-container{flex-wrap:wrap;gap:12px}.ranking-container{width:100%}#play-btn,#shop-btn{font-size:20px;padding:14px 26px}.controls{display:none}}
  @media (pointer:coarse){.controls{display:none}}
  @media (max-width:700px),(max-height:500px){.wrap{padding:10px}header h1{font-size:15px}.top{top:6px;left:6px;right:6px}.chip{font-size:10px;padding:3px 7px}#room-objective{font-size:11px}.bar{width:clamp(50px,18vw,260px)}#room-objective{white-space:nowrap}#minimap-container{transform:scale(.6);transform-origin:top right}}
</style>
<script>
(function () {
  // 1) 체험 계정: 회원가입 없이 바로 메인 메뉴로 (원래 로그인 흐름은 그대로 남겨 둠)
  var form = document.querySelector('#auth-screen .form-container');
  if (form) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'pf-guest'; b.textContent = '체험 계정으로 바로 시작';
    var n = document.createElement('p');
    n.className = 'pf-note';
    n.innerHTML = '포트폴리오 공개용으로 덧붙인 버튼입니다.<br>계정 · 골드 · 기록은 이 브라우저에만 저장됩니다.';
    form.appendChild(b); form.appendChild(n);
    b.addEventListener('click', function () {
      try {
        var users = JSON.parse(localStorage.getItem('game_users')) || {};
        if (!users.guest) users.guest = { password: 'guest', profile: { company: '포트폴리오', rank: '방문자', name: '게스트' }, gold: 0, highScore: 0, upgrades: { maxHp: 0, attack: 0, speed: 0, pickup: 0 } };
        localStorage.setItem('game_users', JSON.stringify(users));
        localStorage.setItem('lastLoggedInUser', 'guest');
        location.reload();
      } catch (e) { b.textContent = '이 브라우저에서는 저장소를 쓸 수 없어요'; }
    });
  }
  // 2) 터치 화면: 가상 조이스틱 → WASD 키 입력으로 바꿔 전달
  var touch = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || ('ontouchstart' in window);
  var gc = document.getElementById('game-container');
  if (!touch || !gc) return;
  var joy = document.createElement('div'); joy.className = 'pf-joy'; joy.innerHTML = '<i></i>';
  var pb = document.createElement('button'); pb.type = 'button'; pb.className = 'pf-pause'; pb.textContent = '일시정지';
  document.body.appendChild(joy); document.body.appendChild(pb);
  var knob = joy.firstChild, held = {}, pid = null;
  function key(k, down) { if (!!held[k] === down) return; held[k] = down; window.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', { key: k })); }
  function dir(dx, dy) { var t = 0.35; key('a', dx < -t); key('d', dx > t); key('w', dy < -t); key('s', dy > t); }
  function move(e) {
    var r = joy.getBoundingClientRect(), h = r.width / 2;
    var dx = (e.clientX - r.left - h) / h, dy = (e.clientY - r.top - h) / h, m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    knob.style.transform = 'translate(' + dx * 37 + 'px,' + dy * 37 + 'px)';
    dir(dx, dy);
  }
  function end() { pid = null; knob.style.transform = ''; dir(0, 0); }
  joy.addEventListener('pointerdown', function (e) { pid = e.pointerId; try { joy.setPointerCapture(pid); } catch (x) {} move(e); e.preventDefault(); });
  joy.addEventListener('pointermove', function (e) { if (e.pointerId === pid) move(e); });
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
  pb.addEventListener('click', function () { key('p', true); key('p', false); });
  new MutationObserver(function () {
    var on = gc.classList.contains('active');
    joy.style.display = pb.style.display = on ? 'block' : 'none';
    if (!on) end();
  }).observe(gc, { attributes: true, attributeFilter: ['class'] });
})();
</script>
