<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Renju Omok with Canvas</title>
  <style>
    body {
      margin: 0;
      background: #1e1e24;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 { margin: 0 0 10px 0; font-size: 24px; font-weight: 600; }
    #status-bar {
      margin-bottom: 12px;
      font-size: 15px;
      padding: 8px 16px;
      background: #2b2b36;
      border-radius: 8px;
    }
    .status-highlight { font-weight: bold; color: #4facfe; }
    /* 포트폴리오 공개용: 금수 안내를 alert 대신 상태 줄에 표시 */
    #rule-msg { min-height: 20px; margin: -4px 0 8px; font-size: 13px; color: #ff6b6b; text-align: center; }
    canvas {
      width: min(600px, 94vw, calc(100vh - 170px));
      height: auto;
      aspect-ratio: 1;
      touch-action: manipulation;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-wrap { margin-top: 15px; }
    button {
      background: #4facfe;
      border: none;
      color: #fff;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <h1>오목 (렌주룰 엔진)</h1>
  <div id="status-bar">현재 차례: <span id="turn" class="status-highlight">흑 (선수)</span></div>
  <div id="rule-msg" role="status"></div>
  <canvas id="board" width="600" height="600"></canvas>
  <div class="btn-wrap">
    <button onclick="resetGame()">게임 다시 시작</button>
  </div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const turnText = document.getElementById('turn');

const SIZE = 15;
const PADDING = 28;
const CELL = (canvas.width - PADDING * 2) / (SIZE - 1);

const EMPTY = 0, BLACK = 1, WHITE = 2;
let board = Array.from({ length: SIZE }, () => Array(SIZE).fill(EMPTY));
let currentTurn = BLACK;
let gameOver = false;
let forbiddenMoves = new Set();

let ruleTimer = 0;
function showRule(t) {
  const m = document.getElementById('rule-msg');
  m.textContent = t;
  clearTimeout(ruleTimer);
  ruleTimer = setTimeout(() => { m.textContent = ''; }, 2400);
}

function init() {
  resetGame();
  canvas.addEventListener('click', handleClick);
}

function resetGame() {
  board = Array.from({ length: SIZE }, () => Array(SIZE).fill(EMPTY));
  currentTurn = BLACK;
  gameOver = false;
  updateForbiddenMoves();
  draw();
  updateStatus();
}

function updateStatus() {
  if (gameOver) return;
  turnText.textContent = currentTurn === BLACK ? "흑 (선수)" : "백 (후수)";
  turnText.style.color = currentTurn === BLACK ? "#00f2fe" : "#ffaa00";
}

function handleClick(e) {
  if (gameOver) return;
  const rect = canvas.getBoundingClientRect();
  // 화면 크기에 맞춰 줄어든 캔버스도 정확히 찍히도록 비율 보정 (포트폴리오 공개용)
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);

  const col = Math.round((x - PADDING) / CELL);
  const row = Math.round((y - PADDING) / CELL);

  if (row < 0 || row >= SIZE || col < 0 || col >= SIZE) return;
  if (board[row][col] !== EMPTY) return;

  if (currentTurn === BLACK && forbiddenMoves.has(`${row},${col}`)) {
    showRule("렌주룰: 흑돌은 금수(3-3, 4-4, 장목) 자리에 둘 수 없습니다.");
    return;
  }

  board[row][col] = currentTurn;

  if (checkWin(row, col, currentTurn)) {
    draw();
    gameOver = true;
    turnText.textContent = (currentTurn === BLACK ? "흑돌" : "백돌") + " 승리!";
    turnText.style.color = "#00ff88";
    return;
  }

  currentTurn = currentTurn === BLACK ? WHITE : BLACK;
  updateForbiddenMoves();
  updateStatus();
  draw();
}

function updateForbiddenMoves() {
  forbiddenMoves.clear();
  if (currentTurn !== BLACK) return;

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] === EMPTY) {
        if (isForbidden(r, c, BLACK)) {
          forbiddenMoves.add(`${r},${c}`);
        }
      }
    }
  }
}

// 렌주룰 금수 검사 (3-3, 4-4, 6목 이상)
function isForbidden(r, c, color) {
  board[r][c] = color;
  let forbidden = false;

  const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
  let openThrees = 0;
  let fours = 0;

  for (let [dr, dc] of dirs) {
    const lineInfo = getLinePattern(r, c, dr, dc, color);
    if (lineInfo.count >= 6) {
      forbidden = true; // 장목 금수
      break;
    }
    if (lineInfo.isOpenThree) openThrees++;
    if (lineInfo.isFour) fours++;
  }

  if (openThrees >= 2 || fours >= 2) {
    forbidden = true; // 3-3 or 4-4
  }

  board[r][c] = EMPTY;
  return forbidden;
}

function getLinePattern(r, c, dr, dc, color) {
  let count = 1;
  let openEnds = 0;

  // 정방향
  let step = 1;
  while (isValid(r + dr * step, c + dc * step) && board[r + dr * step][c + dc * step] === color) {
    count++;
    step++;
  }
  if (isValid(r + dr * step, c + dc * step) && board[r + dr * step][c + dc * step] === EMPTY) {
    openEnds++;
  }

  // 역방향
  step = 1;
  while (isValid(r - dr * step, c - dc * step) && board[r - dr * step][c - dc * step] === color) {
    count++;
    step++;
  }
  if (isValid(r - dr * step, c - dc * step) && board[r - dr * step][c - dc * step] === EMPTY) {
    openEnds++;
  }

  return {
    count: count,
    isOpenThree: (count === 3 && openEnds === 2),
    isFour: (count === 4 && openEnds >= 1)
  };
}

function isValid(r, c) {
  return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
}

function checkWin(r, c, color) {
  const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
  for (let [dr, dc] of dirs) {
    let count = 1;
    let step = 1;
    while (isValid(r + dr * step, c + dc * step) && board[r + dr * step][c + dc * step] === color) {
      count++;
      step++;
    }
    step = 1;
    while (isValid(r - dr * step, c - dc * step) && board[r - dr * step][c - dc * step] === color) {
      count++;
      step++;
    }
    if (color === BLACK && count === 5) return true;
    if (color === WHITE && count >= 5) return true; // 백돌은 장목도 승리
  }
  return false;
}

function draw() {
  ctx.fillStyle = "#deb887";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 격자선
  ctx.strokeStyle = "#4a3520";
  ctx.lineWidth = 1.2;
  for (let i = 0; i < SIZE; i++) {
    ctx.beginPath();
    ctx.moveTo(PADDING, PADDING + i * CELL);
    ctx.lineTo(canvas.width - PADDING, PADDING + i * CELL);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(PADDING + i * CELL, PADDING);
    ctx.lineTo(PADDING + i * CELL, canvas.height - PADDING);
    ctx.stroke();
  }

  // 화점
  const stars = [3, 7, 11];
  for (let r of stars) {
    for (let c of stars) {
      ctx.beginPath();
      ctx.arc(PADDING + c * CELL, PADDING + r * CELL, 3.5, 0, Math.PI * 2);
      ctx.fillStyle = "#4a3520";
      ctx.fill();
    }
  }

  // 돌 렌더링
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      if (board[r][c] !== EMPTY) {
        ctx.beginPath();
        ctx.arc(PADDING + c * CELL, PADDING + r * CELL, CELL * 0.43, 0, Math.PI * 2);
        if (board[r][c] === BLACK) {
          ctx.fillStyle = "#111";
          ctx.fill();
        } else {
          ctx.fillStyle = "#f7f7f7";
          ctx.fill();
          ctx.strokeStyle = "#ccc";
          ctx.stroke();
        }
      }
    }
  }

  // 흑돌 턴일 때 금수 위치 'X' 표시
  if (!gameOver && currentTurn === BLACK) {
    forbiddenMoves.forEach(coord => {
      const [r, c] = coord.split(',').map(Number);
      const px = PADDING + c * CELL;
      const py = PADDING + r * CELL;
      const len = 7;

      ctx.strokeStyle = "#ff2a2a";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(px - len, py - len);
      ctx.lineTo(px + len, py + len);
      ctx.moveTo(px + len, py - len);
      ctx.lineTo(px - len, py + len);
      ctx.stroke();
    });
  }
}

init();
</script>
</body>
</html>
